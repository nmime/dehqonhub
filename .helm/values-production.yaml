# For staging deployments, copy this file to values-staging.yaml and adjust:
# - replicas to 1-2
# - resources to dev-level
# - image tags to preview/edge
#
# Example staging deploy:
#   helm upgrade --install nrb ./chart \
#     -f .helm/values-production.yaml \
#     -f .helm/values-staging.yaml \
#     --namespace staging
#
# Key differences for staging:
#   config.nodeEnv: staging
#   secrets.existingSecret: nest-react-boilerplate-staging-secrets
#   apps.*.replicas: 1 or 2
#   apps.*.resources.requests.cpu: 100m
#   apps.*.resources.requests.memory: 256Mi
#   autoscaling.minReplicas: 1
#   autoscaling.maxReplicas: 4
#   ingress.hosts: *.staging.example.com
#   monitoring.enabled: true (but with lower scrape intervals)

secrets:
  existingSecret: nest-react-boilerplate-production-secrets

imagePullSecrets:
  - name: ghcr-credentials

# Production databases are externally managed. For MongoDB, point the existing
# Secret at a multi-node transaction-capable replica set; this chart never
# creates a MongoDB StatefulSet.
database:
  engine: postgres
  ownership: external-db
  mongodb:
    database: nest_react_boilerplate
    replicaSet: ''

config:
  # Mount a licensed, regularly updated GeoIP2/GeoLite2 City MMDB and set this
  # path to enable geo enrichment. Empty keeps geo fields unknown.
  authGeoipDatabasePath: ''
  authLoginNetworkRetentionDays: '30'
  authLoginEventRetentionDays: '365'
  nodeEnv: production
  corsOrigins: https://dehqonhub.uz,https://admin-app.dehqonhub.uz,https://mobile-app.dehqonhub.uz
  betterAuthUrl: https://dehqonhub.uz
  betterAuthTrustedOrigins: https://dehqonhub.uz,https://admin-app.dehqonhub.uz,https://mobile-app.dehqonhub.uz
  authAllowedReturnUrls: https://dehqonhub.uz,https://admin-app.dehqonhub.uz,https://mobile-app.dehqonhub.uz
  paymentReturnUrlOrigins: https://dehqonhub.uz
  authTokenCleanupEnabled: 'true'
  authTokenCleanupIntervalMs: '3600000'
  authTokenCleanupRunOnStart: 'true'
  openApiEnabled: 'false'
  logLevel: info
  rateLimitEnabled: 'true'
  rateLimitStore: redis
  rateLimitWindowMs: '60000'
  rateLimitMax: '100'
  redisUrl: redis://redis-master.databases.svc.cluster.local:6379/0
  redisKeyPrefix: 'nrb:'
  authTelegramEnabled: 'false'
  telegramTmaMaxAgeSeconds: '300'
  telegramOidcEnabled: 'false'
  telegramOidcClientId: ''
  telegramOidcScopes: openid profile
  telegramBotWebhookUrl: https://telegram-bot-api.dehqonhub.uz/telegram/webhook
  telegramMiniAppUrl: https://dehqonhub.uz/telegram-mini-app

postgresql:
  host: postgresql-rw.databases.svc.cluster.local
  port: '5432'
  database: nest_react_boilerplate
  user: nest_react_boilerplate
  ssl: 'true'
  sslRejectUnauthorized: 'true'

frontendNginx:
  listenPort: 8080
  cspConnectSrc: "'self'"

migrations:
  # Required when database.engine=mongodb; keep migration credentials separate
  # from the runtime application Secret.
  mongodbExistingSecret: nest-react-boilerplate-mongodb-migration
  image:
    repository: ghcr.io/your-github-org/nest-react-boilerplate/migrator
    tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
    digest: ''
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: ['ALL'] }

apps:
  authAppApi:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/auth-app-api
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1Gi }
  userAppApi:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/user-app-api
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1Gi }
  adminAppApi:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/admin-app-api
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1Gi }
  discordAppApi:
    enabled: false
    replicas: 1
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/discord-app-api
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  telegramBotApi:
    enabled: false
    replicas: 1
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/telegram-bot-api
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  notificationScheduler:
    enabled: true
    replicas: 1
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/notification-scheduler
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  notificationConsumer:
    enabled: true
    replicas: 1
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/notification-consumer
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  # telegramBotWorker is not deployed in Helm. It uses long-polling (local dev only).
  # In production, use telegramBotApi (webhook mode).
  landingApp:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/landing-app
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
  siteApp:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/site-app
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  mobileApp:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/mobile-app
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
  userApp:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/user-app
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
  adminApp:
    replicas: 3
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/admin-app
      tag: sha-REPLACE_WITH_RELEASE_GIT_SHA
      digest: ''
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
  hosts:
    - host: dehqonhub.uz
      service: user-app
      paths: ['/']
    - host: mobile-app.dehqonhub.uz
      service: mobile-app
      paths: ['/']
    - host: admin-app.dehqonhub.uz
      service: admin-app
      paths: ['/']
    - host: auth-app-api.dehqonhub.uz
      service: auth-app-api
      paths: ['/']
    - host: user-app-api.dehqonhub.uz
      service: user-app-api
      paths: ['/']
    - host: admin-app-api.dehqonhub.uz
      service: admin-app-api
      paths: ['/']
    - host: telegram-bot-api.dehqonhub.uz
      service: telegram-bot-api
      paths: ['/']
  tls:
    - secretName: nest-react-boilerplate-tls
      hosts:
        - dehqonhub.uz
        - mobile-app.dehqonhub.uz
        - admin-app.dehqonhub.uz
        - auth-app-api.dehqonhub.uz
        - user-app-api.dehqonhub.uz
        - admin-app-api.dehqonhub.uz
        - telegram-bot-api.dehqonhub.uz

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilization: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 1

monitoring:
  enabled: true
  otel:
    enabled: true
    endpoint: ''
    metricExportInterval: '30000'
  otelCollector:
    enabled: true
    replicas: 2
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true
  grafanaDashboard:
    enabled: true

# Enable after provisioning durable storage/object-store credentials. See
# docs/operations/observability-dr.md for the encryption/upload hook contract.
backups:
  enabled: false
  schedule: '17 * * * *'
  mongodb:
    # Required when database.engine=mongodb and backups.enabled=true. The Secret
    # contains MONGODB_BACKUP_RESTORE_URI for a backup+restore role in admin.
    existingSecret: nest-react-boilerplate-mongodb-backup-restore
  destination:
    objectStore:
      enabled: true
      existingSecret: nest-react-boilerplate-backup-object-store
      bucket: example-prod-backups
      prefix: ''
  encryption:
    enabled: true
    existingSecret: nest-react-boilerplate-backup-encryption
    command: 'age -r "$AGE_RECIPIENT" -o "$BACKUP_FILE.age" "$BACKUP_FILE" && rm -f "$BACKUP_FILE" && BACKUP_FILE="$BACKUP_FILE.age"'
  hooks:
    upload: 'aws s3 cp "$BACKUP_FILE" "s3://$BACKUP_BUCKET/$BACKUP_PREFIX/$(basename "$BACKUP_FILE")" --only-show-errors'
  retention:
    keepLast: 336

# Coroot — auto-discovering application observability (enabled in production)
coroot:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/coroot/coroot
    tag: '1.0.0'
    pullPolicy: IfNotPresent
  rbac:
    readSecrets: false
  prometheusUrl: 'http://vmcluster-vmsingle.monitoring.svc.cluster.local:8429'
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: ['ALL'] }

networkPolicy:
  enabled: true
