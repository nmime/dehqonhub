<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DehqonHub</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Brand green (--green-primary). The product ships light-only; no dark
         theme-color variant is declared on purpose. -->
    <meta name="theme-color" content="#1ca24c" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Per-deployment runtime config; must load before the app bundle so flags
         are readable synchronously. Rewritten at container start. -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
